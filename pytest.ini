[pytest]
# All tests live in the repo-root /tests tree, split by the thing under test:
#   tests/backend  — FastAPI app, services, agents (imports the backend package)
#   tests/infra    — Terraform config assertions (no AWS calls)
#   tests/e2e      — end-to-end against a DEPLOYED environment (opt-in)
testpaths = tests

# The backend is not an installed package, so put its root on sys.path. This is
# what lets `from app.main import app` resolve from the repo root.
pythonpath = backend

python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

addopts =
    --verbose
    --strict-markers
    --tb=short
    --cov=backend/app
    --cov-report=term-missing
    --cov-report=xml
    # Raised 30 -> 68 once real coverage reached 70.1%. Deliberately a couple
    # of points BELOW actual: the gate exists to catch a regression, not to fail
    # a branch that legitimately adds a few uncovered lines. Raise it when
    # coverage climbs, never lower it to make a build pass.
    --cov-fail-under=68
    # E2E hits a real deployment (AWS credentials + live URLs) and costs money,
    # so it never runs by default. Opt in with: pytest -m e2e --run-e2e
    -m "not e2e"

markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may require AWS resources)
    slow: Tests that take significant time to run
    agents: Tests for AI agent functionality
    infra: Terraform/infrastructure configuration tests (no AWS calls)
    e2e: End-to-end tests against a deployed environment (requires --run-e2e)

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
